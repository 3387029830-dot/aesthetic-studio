<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/beats.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      #film { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="108.5" data-width="1920" data-height="1080">
      <canvas id="film" width="1920" height="1080"></canvas>
      <audio id="song" class="clip" src="assets/audio/song.m4a" data-start="0" data-duration="108.5" data-track-index="2" data-volume="1" data-fade-out="1.2"></audio>
    </div>
    <script src="assets/film.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 108.5 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
