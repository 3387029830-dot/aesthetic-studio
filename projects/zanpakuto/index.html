<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>斬魄刀 · 名を呼べ</title>
  <meta name="description" content="一把斩魄刀从无名到卍解的四个阶段。BLEACH 非官方致敬页面。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;800&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <!-- 序：纸面上一把无名的刀 -->
  <header class="hero">
    <h1 class="hero-title" aria-label="斬魄刀">
      <span>斬</span><span>魄</span><span>刀</span>
    </h1>
    <div class="hero-blade" aria-hidden="true"></div>
    <p class="hero-line">每一把刀，<br />都在等你叫出它的名字。</p>
    <p class="hero-hint" aria-hidden="true">向下</p>
  </header>

  <!-- 壱 浅打 -->
  <section class="stage asauchi">
    <span class="stage-mark">壱</span>
    <div class="stage-body">
      <h2 class="v-title">浅打</h2>
      <div class="prose">
        <p>死神入队时领到的刀，形制相同，没有名字。</p>
        <p>此时它只是一块钢。</p>
      </div>
    </div>
  </section>

  <!-- 弐 対話 -->
  <section class="stage taiwa">
    <span class="stage-mark">弐</span>
    <div class="stage-body">
      <h2 class="v-title">対話</h2>
      <p class="whisper">每天握着它，和它说话，把自己的灵魂一点点交给它。直到某一天，你在内心深处听见一个声音——它告诉你，它叫什么。</p>
    </div>
  </section>

  <!-- 参 始解：横向卷轴 -->
  <section class="shikai" aria-labelledby="shikai-title">
    <div class="shikai-intro">
      <span class="stage-mark">参</span>
      <h2 id="shikai-title" class="v-title">始解</h2>
      <p>念出解号，呼唤其名。<br />刀第一次显露真正的形状。</p>
    </div>
    <div class="shikai-track">
      <figure class="call">
        <p class="call-word">散れ</p>
        <figcaption><b>千本桜</b><span>散吧</span></figcaption>
      </figure>
      <figure class="call">
        <p class="call-word">舞え</p>
        <figcaption><b>袖白雪</b><span>起舞吧</span></figcaption>
      </figure>
      <figure class="call">
        <p class="call-word">吼えろ</p>
        <figcaption><b>蛇尾丸</b><span>咆哮吧</span></figcaption>
      </figure>
      <figure class="call">
        <p class="call-word">射殺せ</p>
        <figcaption><b>神鎗</b><span>射杀吧</span></figcaption>
      </figure>
      <figure class="call">
        <p class="call-word">霜天に坐せ</p>
        <figcaption><b>氷輪丸</b><span>端坐于霜天</span></figcaption>
      </figure>
    </div>
  </section>

  <!-- 肆 卍解：一刀切开纸面 -->
  <section class="bankai" aria-labelledby="bankai-title">
    <div class="void">
      <canvas class="reiatsu" aria-hidden="true"></canvas>
      <span class="stage-mark stage-mark--light">肆</span>
      <h2 id="bankai-title" class="bankai-word">卍解</h2>
      <p class="bankai-sub">让刀的本体完全显现。<br />能做到的人，百年里没有几个。</p>
    </div>
    <div class="sheets" aria-hidden="true">
      <div class="sheet sheet-base"></div>
      <div class="sheet sheet-a"><p class="sheet-text">还不够。</p></div>
      <div class="sheet sheet-b"><p class="sheet-text sheet-text--b">再往深处。</p></div>
      <div class="slash-wrap"><div class="slash"></div></div>
    </div>
  </section>

  <!-- 终 -->
  <footer class="coda">
    <p class="coda-line">名字，<br />是你和刀之间的契约。</p>
    <p class="coda-credit">致敬久保带人《BLEACH》。非官方同人页面，与版权方无关。</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
